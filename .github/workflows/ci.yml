name: JEMBA CI

on:
  push:
    branches:
      - main
      - research
      - develop
  pull_request:
    branches:
      - main
      - research
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .

      - name: Black
        run: |
          black --check .

      - name: MyPy
        run: |
          mypy jemba_core

      - name: Pytest
        run: |
          python -m pytest --cov=jemba_core --cov-report=term-missing
